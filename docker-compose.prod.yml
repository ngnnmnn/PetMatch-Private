services:
  # ==========================================
  # Service Backend (NestJS + Prisma)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: petmatching_backend
    restart: always
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - petmatching_network

  # ==========================================
  # Service Frontend (Next.js Standalone)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: petmatching_frontend
    restart: always
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - petmatching_network

  # ==========================================
  # Service Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: petmatching_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
    networks:
      - petmatching_network

networks:
  petmatching_network:
    driver: bridge
