<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petmatch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#E45D1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="180" height="180" rx="42" fill="url(#petmatch-bg)" />

  <!-- Logo Emblem: Heart Paw (Pet Matching & Care) -->
  <g transform="translate(40, 40) scale(1.0)" filter="url(#shadow)">
    <!-- Main Heart Pad -->
    <path
      d="M50 78 C32 64 22 52 22 39 C22 28.5 30.5 20 41 20 C46.8 20 50 23.5 50 23.5 C50 23.5 53.2 20 59 20 C69.5 20 78 28.5 78 39 C78 52 68 64 50 78 Z"
      fill="#FFFFFF"
    />

    <!-- 4 surrounding toes / ears -->
    <ellipse cx="16" cy="42" rx="7.5" ry="11" transform="rotate(-28 16 42)" fill="#FFFFFF" />
    <ellipse cx="33" cy="15" rx="8" ry="12" transform="rotate(-12 33 15)" fill="#FFFFFF" />
    <ellipse cx="67" cy="15" rx="8" ry="12" transform="rotate(12 67 15)" fill="#FFFFFF" />
    <ellipse cx="84" cy="42" rx="7.5" ry="11" transform="rotate(28 84 42)" fill="#FFFFFF" />
  </g>
</svg>